  <line x1="540" y1="440" x2="340" y2="320" stroke="#5c7cfa" stroke-width="1.2" mask="url(#imagine-text-gaps-4l0lu9)" style="fill:rgb(0, 0, 0);stroke:rgb(92, 124, 250);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

