  <!-- Right fold triangle -->
  <polygon points="540,440 340,320 540,190" fill="#f0f4ff" stroke="#3b5bdb" stroke-width="1" style="fill:rgb(240, 244, 255);stroke:rgb(59, 91, 219);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Crease lines (subtle blue) -->
