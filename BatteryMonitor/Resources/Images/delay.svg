  <defs>
    
  <mask id="imagine-text-gaps-4l0lu9" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="480" fill="white"/><rect x="269.3203125" y="92" width="62" height="100" fill="black" rx="2"/><rect x="356.1484375" y="76" width="37" height="71" fill="black" rx="2"/><rect x="415.4140625" y="63" width="27" height="47" fill="black" rx="2"/><rect x="496.65625" y="390" width="22.6875" height="35" fill="black" rx="2"/></mask></defs>

  <!-- Envelope body — white fill, blue/violet border -->
  <rect x="140" y="190" width="400" height="250" rx="8" fill="white" stroke="#3b5bdb" stroke-width="2.5" style="fill:rgb(255, 255, 255);stroke:rgb(59, 91, 219);color:rgb(0, 0, 0);stroke-width:2.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Left fold triangle — white fill, blue tint edge -->
