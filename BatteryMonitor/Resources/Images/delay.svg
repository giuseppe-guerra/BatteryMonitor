  <text x="295" y="172" text-anchor="middle" style="fill:rgb(47, 158, 68);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Playfair Display&quot;, Georgia, serif;font-size:72px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">Z</text>
  <text x="372" y="132" text-anchor="middle" style="fill:rgb(64, 192, 87);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Playfair Display&quot;, Georgia, serif;font-size:50px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">z</text>
  <text x="427" y="100" text-anchor="middle" style="fill:rgb(105, 219, 124);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Playfair Display&quot;, Georgia, serif;font-size:32px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">z</text>

