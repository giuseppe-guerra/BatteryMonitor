  <line x1="540" y1="190" x2="340" y2="310" stroke="#b197fc" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(177, 151, 252);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

